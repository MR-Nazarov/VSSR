# @package _global_
# Sequential Expert Training: Sagittal -> Axial -> Coronal (SAC) - 4x Undersampling
# Expert 3: Coronal network trained on axial-reconstructed data

defaults:
  - /loss: l1
  - override /model: SUNet
  - override /optimizer: adamw
  - override /metrics: basic
  - override /scheduler: cosine
  - override /logger: wandb

# Training settings
num_epochs: 200
device: cuda
seed: 42
test: false
resume_from: "checkpoints/SAC_3_coronal_from_axial_8x_1027_1629_latest.pth"  # Set to checkpoint path to resume training

# Training behavior
use_validation: true
use_metrics: true
use_scheduler: true
show_progress: true
use_mixed_precision: false

# Gradient settings
grad_clip: 1.0

# Checkpoint settings
checkpoint_freq: 1
save_last_checkpoint: true
cleanup_checkpoints: true
max_checkpoints_keep: 5
best_metric: "ssim"        # Options: "val_loss", "psnr", "ssim", "train_loss"
best_metric_mode: "max"        # "min" for loss, "max" for PSNR/SSIM

# Early stopping
early_stopping: false
early_stopping_patience: 15
early_stopping_min_delta: 1e-4

# Testing settings
save_test_inputs: false
save_test_visualizations: false
num_vis_samples: 2

# WandB image logging
log_images_wandb: true
log_images_freq: 1  # Log images every N epochs

# Other settings
timing_samples: 3
DataParallel: false
hasTarget: true

# Model settings
model:
  img_size: [256, 128]  # Coronal slices are non-square (H=256, W=128)

# Optimizer settings
optimizer:
  lr: 1e-4          # Learning rate
  weight_decay: 1e-5  # Weight decay

# Scheduler settings
scheduler:
  T_max: 200
  eta_min: 1e-6

# Dataset settings - Using resliced data from axial expert (Stage 2)
dataset_train:
  args:
    jsonData: "json_datasets/axial_to_coronal_2_4x_1.json"  # Resliced data from axial expert
    transforms:
      LoadImaged:
        keys: ['input', 'target']
        ensure_channel_first: true
      SqueezeDimd:
        keys: ['target']  # Only squeeze target (original GT slices have extra dim)
        dim: 1  # Coronal slices use dim 1
      # Pad to fixed size to handle variable dimensions (coronal can be 254 instead of 256)
      SpatialPadd:
        keys: ['input', 'target']
        spatial_size: [256, 128]  # Ensure all images are 256x128

dataset_test:
  args:
    jsonData: "json_datasets/axial_to_coronal_2_4x_1.json"   # Resliced data from axial expert
    transforms:
      LoadImaged:
        keys: ['input', 'target']
        ensure_channel_first: true
      SqueezeDimd:
        keys: ['target']  # Only squeeze target (original GT slices have extra dim)
        dim: 1  # Coronal slices use dim 1
      # Pad to fixed size to handle variable dimensions (coronal can be 254 instead of 256)
      SpatialPadd:
        keys: ['input', 'target']
        spatial_size: [256, 128]  # Ensure all images are 256x128

# Dataloader settings
dataloader_train:
  batch_size: 16  # Batch size for training

dataloader_eval:
  batch_size: 32  # Batch size for evaluation

# Project settings
experiment_name: "SAC_3_coronal_from_axial_4x"
