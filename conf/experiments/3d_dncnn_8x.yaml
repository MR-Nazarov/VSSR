# @package _global_
defaults:
  - /loss: l1
  - override /model: dncnn3d
  - override /optimizer: adamw
  - override /metrics: basic_3d
  - override /scheduler: cosine
  - override /logger: wandb

# Training settings
num_epochs: 200
device: cuda
seed: 42
test: false
resume_from: null  # Set to checkpoint path to resume training

# Training behavior
use_validation: true
use_metrics: true
use_scheduler: true
show_progress: true
use_mixed_precision: false

# Gradient settings
grad_clip: 1.0

# Checkpoint settings
checkpoint_freq: 1
save_last_checkpoint: true
cleanup_checkpoints: true
max_checkpoints_keep: 5
best_metric: "ssim"        # Options: "val_loss", "psnr", "ssim", "train_loss"
best_metric_mode: "max"        # "min" for loss, "max" for PSNR/SSIM

# Early stopping
early_stopping: false
early_stopping_patience: 15
early_stopping_min_delta: 1e-4

# Testing settings
save_test_inputs: false
save_test_visualizations: false
num_vis_samples: 8

# WandB image logging
log_images_wandb: true
log_images_freq: 1  # Log images every N epochs

# Other settings
timing_samples: 3
DataParallel: false
hasTarget: true

# Optimizer settings
optimizer:
  lr: 0.001
  weight_decay: 1e-4

# Scheduler settings
scheduler:
  T_max: 200
  eta_min: 1e-6

# Dataset settings
dataset_train:
  args:
    jsonData: "json_datasets/Multi_view_IXI_3D_8x.json"  # Override JSON file for training
    transforms:
      LoadImaged:
        keys: ['input', 'target']
        ensure_channel_first: true
      RandSpatialCropd:
        keys: ['input', 'target']
        roi_size: [64, 64, 64]  # Random 64x64x64 crops for training
        random_size: false

dataset_test:
  args:
    jsonData: "json_datasets/Multi_view_IXI_3D_8x.json"   # Override JSON file for validation
    transforms:
      LoadImaged:
        keys: ['input', 'target']
        ensure_channel_first: true
    # Sliding window inference settings
    use_sliding_window: true
    roi_size: [64, 64, 64]  # Same patch size as training
    sw_batch_size: 4  # Number of patches to process in parallel
    overlap: 0.5  # 50% overlap between patches for smooth blending

# Dataloader settings
dataloader_train:
  batch_size: 4  # Can use larger batch size with crops (64x64x64 patches)

dataloader_eval:
  batch_size: 1  # Keep batch size 1 for full volumes in validation

# Project settings
experiment_name: "3d_dncnn_8x"
